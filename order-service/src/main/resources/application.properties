server.port=8081
spring.application.name=order-service

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Downstream Microservice Topology Configuration
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8082}
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8083}
order.downstream.propagation.enabled=${ORDER_DOWNSTREAM_ENABLED:true}

