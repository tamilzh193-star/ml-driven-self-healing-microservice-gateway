server:
  port: 8080

spring:
  application:
    name: api-gateway
  datasource:
    # Default datasource with H2 development fallback; overridden by Docker / MySQL profiles
    url: ${MYSQL_URL:jdbc:h2:mem:self_healing_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
    driver-class-name: ${MYSQL_DRIVER:org.h2.Driver}
    username: ${MYSQL_USER:sa}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      initialization-fail-timeout: -1
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/orders/**, /orders, /order/**, /order

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/payments/**, /payments, /payment/**, /payment

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/inventory/**, /inventory, /invetory/**, /invetory

        # Direct service routes (supports /order-service/chaos/** and /order-service/orders, etc.)
        - id: order-service-direct
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/order-service/**
          filters:
            - StripPrefix=1

        - id: payment-service-direct
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/payment-service/**
          filters:
            - StripPrefix=1

        - id: inventory-service-direct
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/inventory-service/**, /invetory-service/**
          filters:
            - StripPrefix=1

# Configured Target Downstream Services
order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:8081}

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8082}

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

# Genuine Docker Container Restart Configuration
docker:
  container:
    mode: ${DOCKER_CONTAINER_MODE:false}
  socket:
    path: ${DOCKER_SOCKET_PATH:/var/run/docker.sock}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

telemetry:
  collection:
    enabled: true
    interval-ms: 5000
    csv-enabled: ${TELEMETRY_CSV_ENABLED:false}
    csv-path: ${TELEMETRY_CSV_PATH:runtime/telemetry_live.csv}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:5000}
    enabled: ${ML_SERVICE_ENABLED:true}
    timeout-ms: 3000

anomaly:
  confirmation:
    enabled: ${ANOMALY_CONFIRMATION_ENABLED:true}
    window-size: 5
    threshold-count: 3
    consecutive-required: 3
    recovery-cycles: 2

healing:
  engine:
    enabled: ${HEALING_ENGINE_ENABLED:true}
    cooldown-seconds: 30
    max-retries: 3
    verification-delay-ms: 2500
  restart:
    mode: ${HEALING_RESTART_MODE:auto}

topology:
  dependencies:
    order-service:
      - payment-service
      - inventory-service
    payment-service: []
    inventory-service: []

security:
  admin:
    key:
      enabled: ${ADMIN_AUTH_ENABLED:true}

admin:
  api:
    key: ${ADMIN_API_KEY:${ADMIN_KEY:}}

persistence:
  database:
    enabled: ${DB_PERSISTENCE_ENABLED:true}
    batch-size: 50

---
# Production Docker Environment Profile - Primary MySQL 8.0 Persistence (:3306)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/self_healing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:rootpassword}

---
# Local MySQL Profile - Primary MySQL 8.0 Persistence on Localhost (:3306)
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/self_healing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:rootpassword}

---
# Standalone Local Development Profile (Embedded H2 Fallback Mode)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${MYSQL_URL:jdbc:h2:mem:self_healing_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
    driver-class-name: ${MYSQL_DRIVER:org.h2.Driver}
    username: ${MYSQL_USER:sa}
    password: ${MYSQL_PASSWORD:}
