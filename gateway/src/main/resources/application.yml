server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/payments/**

        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/inventory/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

telemetry:
  collection:
    enabled: true
    interval-ms: 5000
    csv-path: ../dataset/telemetry.csv
