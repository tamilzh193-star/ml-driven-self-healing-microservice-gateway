server:
  port: 8080

spring:
  application:
    name: api-gateway
  datasource:
    url: ${MYSQL_URL:jdbc:h2:mem:self_healing_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
    driver-class-name: ${MYSQL_DRIVER:org.h2.Driver}
    username: ${MYSQL_USER:sa}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      initialization-fail-timeout: -1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/payments/**

        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/inventory/**

        # Chaos endpoint routes for controlled fault injection via Gateway
        - id: order-service-chaos
          uri: http://localhost:8081
          predicates:
            - Path=/order-service/chaos/**
          filters:
            - StripPrefix=1

        - id: payment-service-chaos
          uri: http://localhost:8082
          predicates:
            - Path=/payment-service/chaos/**
          filters:
            - StripPrefix=1

        - id: inventory-service-chaos
          uri: http://localhost:8083
          predicates:
            - Path=/inventory-service/chaos/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

telemetry:
  collection:
    enabled: true
    interval-ms: 5000
    csv-path: ../dataset/telemetry.csv

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:5000}
    enabled: ${ML_SERVICE_ENABLED:true}
    timeout-ms: 3000

anomaly:
  confirmation:
    enabled: ${ANOMALY_CONFIRMATION_ENABLED:true}
    window-size: 5
    threshold-count: 3
    consecutive-required: 3
    recovery-cycles: 2

healing:
  engine:
    enabled: ${HEALING_ENGINE_ENABLED:true}
    cooldown-seconds: 30
    max-retries: 3
    verification-delay-ms: 2500

persistence:
  database:
    enabled: ${DB_PERSISTENCE_ENABLED:true}
    batch-size: 50




